seed_everything: 42
name: alice3-HF-test                      # CHANGED

data:
  train_dir: /data/alice/idumitra/alice3/parquet_test/    # CHANGED
  val_dir:   /data/alice/idumitra/alice3/parquet_test/    # CHANGED (same events, smoke test only)
  test_dir:  /data/alice/idumitra/alice3/parquet_test/    # CHANGED

  num_workers: 0                          # CHANGED (only 10 events)
  num_train: -1
  num_test: -1
  num_val: -1

  hit_volume_ids: null                    # CHANGED: TrackML volume IDs (7, 8, 9) don't apply

  particle_min_pt: 0.3                    # CHANGED: placeholder, to be agreed with Pierre/Panos
  particle_max_abs_eta: 4.0
  particle_min_num_hits: 3
  event_max_num_particles: 6000           # CHANGED: you have ~3,600-5,200 per event
  strict_max_objects: false

  inputs:
    hit:                                  # CHANGED: only what your parquet has
      - x
      - y
      - z
      - r
      - eta
      - phi

  targets:
    hit:
      - on_valid_particle                 # CHANGED: is_first dropped
    particle:
      - pt

trainer:
  max_epochs: 5                           # CHANGED: smoke test
  accelerator: cpu                        # set to cpu if you have no GPU
  devices: 1
  precision: 32
  log_every_n_steps: 1                    # CHANGED
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: True

  logger:                                 # CHANGED: Comet needs an API key
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: alice3_filtering

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: true
        write_outputs: false
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:                   # CHANGED
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 6         # CHANGED: must equal len(fields)
                    hidden_layers: [128]
                    output_size: &dim 256
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 2
          dim: *dim
          attn_type: torch
          window_size: null
          window_wrap: false
          hybrid_norm: true
          norm: RMSNorm

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
