seed_everything: 42
name: alice3-HF-test                      # CHANGED

data:   # rn they re the exact same, need to split them
  train_dir: /data/alice/idumitra/alice3/parquet_test/train/    # CHANGED
  val_dir:   /data/alice/idumitra/alice3/parquet_test/val/    # CHANGED 
  test_dir:  /data/alice/idumitra/alice3/parquet_test/test/    # CHANGED

  num_workers: 4                          # CHANGED (only 10 events)
  num_train: -1
  num_test: -1
  num_val: -1

  hit_volume_ids: null                    # CHANGED
  hit_coord_scale: 0.001
  hit_coord_scale: 0.001                  # x and y reach about ±925 and z about ±3400, so they’re in mm, so scaled w this they become m to be o(1)

  particle_min_pt: 0.3                    # CHANGED: idk decide later what to put maybe change data.py to have a max value also
  particle_max_abs_eta: 4.0
  particle_min_num_hits: 3
  event_max_num_particles: 2500
  strict_max_objects: false

  inputs:                                 # decides what tensors the dataset hands over
    hit:                                  # CHANGED: only what your parquet has
      - x
      - y
      - z
      - r
      - eta
      - phi

  targets:
    hit:
      - on_valid_particle                 # CHANGED: is_first dropped
    particle:
      - pt

trainer:
  max_epochs: 5                           # CHANGED
  accelerator: gpu                        # see how to change to cpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 1                    # CHANGED
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: True

  logger:                                 # CHANGED: to the csv idk what commet is
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: logs
      name: alice3_filtering

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: true
        write_outputs: false
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:                   # CHANGED: decide what the network actually get
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 6         # CHANGED: must equal len(fields)
                    hidden_layers: [128]
                    output_size: &dim 256
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: RMSNorm

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
